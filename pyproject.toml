[project]
name = "backendtesis"
version = "1.0.0"
description = "IDN Homograph Phishing Detector — USB Bogotá 2026"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=90"
markers = [
    "unit: pruebas aisladas sin servicios externos (tests/unit)",
    "integration: pruebas contra PostgreSQL/Redis/Chroma reales y efímeros (tests/integration)",
    "system: pruebas que requieren el stack completo o servicios live (tests/security, agents live)",
    "regression: pruebas que fijan bugs ya corregidos (no deben volver)",
    "smoke: subconjunto rápido de primitivas del núcleo para verificar salud",
    "sanity: chequeo profundo y estrecho de un componente (parsers, fusión)",
    "acceptance: pruebas ligadas a criterios de aceptación de la spec",
]

[tool.coverage.run]
omit = ["tests/*", "scripts/*", "docs/*"]

[tool.uv]
# Va primero: la regla semgrep uv-missing-dependency-cooldown deja de leer la
# sección en el primer corchete, y la lista de abajo abre uno.
exclude-newer = "7 days"
constraint-dependencies = ["numpy==2.4.4"]

[dependency-groups]
dev = [
    "datasets>=5.0.1",
]
