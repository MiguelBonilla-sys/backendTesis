[project]
name = "backendtesis"
version = "1.0.0"
description = "IDN Homograph Phishing Detector — USB Bogotá 2026"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["tests/*", "scripts/*", "docs/*"]

[tool.uv]
constraint-dependencies = ["numpy==2.4.4"]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "datasets>=5.0.1",
]
