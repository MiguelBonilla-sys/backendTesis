name: backend-tesis-full

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bt-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Monta tu código fuente ("la ruta") directamente dentro del contenedor sin duplicar archivos.
    env_file:
      - .env
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    container_name: bt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phishing_detector
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:1.5.5
    container_name: bt-chroma
    restart: unless-stopped
    environment:
      CHROMA_SERVER_PORT: 8000
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v2/heartbeat\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - type: bind
        source: ${PODMAN_HOST_DATA_DIR}/chroma
        target: /data

  redis:
    image: redis:7-alpine
    container_name: bt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - type: bind
        source: ${PODMAN_HOST_DATA_DIR}/redis
        target: /data

  llamastack:
    image: llamastack/distribution-starter:latest
    container_name: bt-llamastack
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      LLAMA_STACK_PORT: "5001"
      OLLAMA_URL: http://ollama:11434/v1
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${PODMAN_HOST_DATA_DIR}/llamastack
        target: /root/.llama
    command: ["--port", "5001"]

  ollama:
    image: ollama/ollama:latest
    container_name: bt-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 5
    volumes:
      - type: bind
        source: ${PODMAN_HOST_DATA_DIR}/ollama
        target: /root/.ollama

volumes:
  pg_data:
