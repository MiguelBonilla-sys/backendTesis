name: backendtesis-deps

services:
  postgres:
    image: postgres:15-alpine
    container_name: bt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phishing_detector
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    logging:
      driver: "loki"
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "400"

  chroma:
    image: chromadb/chroma:1.5.6
    container_name: bt-chroma
    restart: unless-stopped
    environment:
      CHROMA_PERSIST_PATH: /data
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    logging:
      driver: "loki"
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "400"

  redis:
    image: redis:7-alpine
    container_name: bt-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    logging:
      driver: "loki"
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "400"

  ollama:
    image: ollama/ollama:latest
    container_name: bt-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    logging:
      driver: "loki"
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "400"

  llamastack:
    image: llamastack/distribution-starter:latest
    container_name: bt-llamastack
    restart: unless-stopped
    environment:
      LLAMA_STACK_PORT: "8321"
      OLLAMA_URL: http://ollama:11434/v1
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "5001:8321"
    volumes:
      - llama_data:/root/.llama
    command: ["--port", "8321"]
    logging:
      driver: "loki"
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "400"

  # === Monitoreo y Logs ===
  loki:
    image: grafana/loki:latest
    container_name: bt-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: bt-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === Gestión de Base de Datos ===
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bt-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: postgres
      PMA_USER: postgres
      PMA_PASSWORD: postgres
      PMA_PORT: 5432
    ports:
      - "8080:80"
    depends_on:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  adminer:
    image: adminer:latest
    container_name: bt-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - backendtesis-deps_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_data:
  chroma_data:
  redis_data:
  ollama_data:
  llama_data:
  loki_data:
  grafana_data:

networks:
  backendtesis-deps_default:
    driver: bridge
