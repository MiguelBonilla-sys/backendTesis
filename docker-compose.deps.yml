name: backendtesis-deps

services:
  postgres:
    image: postgres:15-alpine
    container_name: bt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phishing_detector
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:1.5.6
    container_name: bt-chroma
    restart: unless-stopped
    environment:
      CHROMA_PERSIST_PATH: /data
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data

  redis:
    image: redis:7-alpine
    container_name: bt-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: bt-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

  llamastack:
    image: llamastack/distribution-starter:latest
    container_name: bt-llamastack
    restart: unless-stopped
    environment:
      LLAMA_STACK_PORT: "8321"
      OLLAMA_URL: http://ollama:11434/v1
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "5001:8321"
    volumes:
      - llama_data:/root/.llama
    command: ["--port", "8321"]

volumes:
  pg_data:
  chroma_data:
  redis_data:
  ollama_data:
  llama_data:
