name: backendtesis-deps

services:
  postgres:
    image: postgres:15-alpine
    container_name: bt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phishing_detector
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:1.5.6
    container_name: bt-chroma
    restart: unless-stopped
    environment:
      CHROMA_PERSIST_PATH: /data
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data

  redis:
    image: redis:7-alpine
    container_name: bt-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  llamastack:
    image: llamastack/distribution-starter:latest
    container_name: bt-llamastack
    restart: unless-stopped
    environment:
      LLAMA_STACK_PORT: "8321"
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "5001:8321"
    volumes:
      - llama_data:/root/.llama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--port", "8321"]

volumes:
  pg_data:
  chroma_data:
  redis_data:
  llama_data:
